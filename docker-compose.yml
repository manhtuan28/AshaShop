services:
  # ==========================================
  # Database: MongoDB 7.0
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: ashashop_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ashashop_network

  # ==========================================
  # In-Memory Cache: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ashashop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ashashop_network

  # ==========================================
  # Backend API Server: NestJS
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ashashop_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ashashop
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key_ashashop_2026_dev_mode
      - JWT_EXPIRES_IN=1d
      - JWT_REFRESH_SECRET=super_secret_refresh_jwt_key_ashashop_2026
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
    depends_on:
      - mongodb
      - redis
    networks:
      - ashashop_network

  # ==========================================
  # Frontend Client: React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ashashop_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ashashop_network

# Persistent Volumes
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# Internal Network
networks:
  ashashop_network:
    driver: bridge
