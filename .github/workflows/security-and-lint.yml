name: Enterprise Security & Code Quality

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ====================================================
  # JOB 1: Secret Leak & Dependency Vulnerability Scan
  # ====================================================
  security-audit:
    name: 🔒 Security & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔎 Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=critical || true

      - name: 🔎 Audit Frontend Dependencies
        run: |
          cd frontend
          npm audit --audit-level=critical || true

  # ====================================================
  # JOB 2: Backend Code Quality & Type Check
  # ====================================================
  backend-quality:
    name: ⚙️ Backend Quality & Build
    runs-on: ubuntu-latest
    needs: [security-audit]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 🏗️ Compile TypeScript & Verify Build
        run: |
          cd backend
          npm run build

  # ====================================================
  # JOB 3: Frontend Code Quality & Bundle Check
  # ====================================================
  frontend-quality:
    name: 🎨 Frontend Quality & Build
    runs-on: ubuntu-latest
    needs: [security-audit]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🏗️ Build Vite Production Bundle
        run: |
          cd frontend
          npm run build
