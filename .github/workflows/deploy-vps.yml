name: Continuous Deployment (CD to VPS)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-vps.yml'

jobs:
  deploy-to-vps:
    name: 🚀 Deploy Backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔄 Bắt đầu cập nhật Backend trên VPS..."
            cd /home/ubuntu/ashashop
            # Pull hoặc sync code và build lại container Backend
            sudo docker compose up -d --build backend
            echo "✅ Triển khai Backend AshaShop lên VPS thành công!"
